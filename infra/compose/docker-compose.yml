# Scope note: docs/BUILDLOG.md originally deferred this whole file to Phase 6
# ("writing it before there are services to compose would be guessing"). Phase 3
# needs a real Postgres to develop against, so this starts with just that — `api`,
# `web` and `executor` containers stay Phase 6 (no Dockerfile exists yet for any of
# them; `uv run uvicorn api.main:app --reload` against this Postgres is the Phase 3
# local workflow, per apps/api/README-equivalent instructions in the Makefile).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_helper"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
