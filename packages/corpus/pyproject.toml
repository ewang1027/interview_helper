[project]
name = "corpus"
version = "0.1.0"
description = "Versioned interview-question corpus: schema, loader, and validator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]
