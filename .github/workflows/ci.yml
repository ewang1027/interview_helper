name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the gate without inventing a commit. Added 2026-08-26, when a push to `main`
  # produced no run at all — Actions was enabled, nothing was queued, and the event was
  # simply never delivered. Without a manual trigger the only remedy for a dropped event
  # is an empty commit, which puts a lie in the history to work around a webhook.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint · types · tests · corpus)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_helper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_helper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # `_test`, and not incidentally: conftest.py refuses to run database tests
      # against a database whose name does not end that way, so CI exercises the same
      # guardrail a developer does rather than being the one place it is bypassed.
      DATABASE_URL: postgresql+psycopg://interview:interview@localhost:5432/interview_helper_test

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the secret scan reads the commits being introduced, not just the
          # tree. A shallow clone has nothing to read, and would report clean.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy apps/api/src apps/executor/src packages/corpus/src

      - name: Test
        run: uv run pytest -q

      # The schema is only meaningfully tested against real Postgres — the CHECK
      # constraint on concept_evidence has no SQLite equivalent.
      # Up, all the way back down, and up again. Only the first direction is ever
      # exercised by developing against a long-lived local database, and OPERATIONS.md
      # treats a migration that cannot be reversed as a deploy that cannot be rolled back.
      - name: Migrate, reverse, migrate
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Seed
        run: uv run python -m api.seed

      - name: DB tests
        run: uv run pytest apps/api/tests -q -m db

      # Reported, not enforced. A coverage threshold in CI turns into a number people
      # satisfy rather than a signal they read, and the marker set matters more than the
      # figure: the same code measures ~26 points lower without a database, because the
      # session layer, the planner and the practice log are covered by db-marked tests.
      - name: Coverage (reported)
        run: |
          uv run pytest -q -m "not sandbox and not e2e and not llm" \
            --cov=api --cov=executor --cov=corpus --cov-report=term | tail -20

      # The escape tests are the Phase 2 gate and need a real daemon — they cannot be
      # meaningfully faked, since what they verify is kernel-enforced isolation.
      - name: Pull sandbox image
        run: docker pull python:3.12-slim

      # Every sandbox-marked test, not just apps/executor's: the coding grader is
      # verified end to end through the same containers, from apps/api.
      - name: Sandbox tests
        run: uv run pytest -q -m sandbox

      # The only test with nothing stubbed: a real executor process on a socket, real
      # containers, real rows. Needs the Postgres service and Docker, so it runs here,
      # after both are known good.
      - name: End-to-end session
        run: uv run pytest -q -m e2e

      # docs/GRADING.md: reference solutions are verified, not trusted. Runs them
      # through the same sandbox a candidate's submission gets.
      # --complexity additionally asserts each reference solution actually meets the
      # complexity_target its own item declares. CI runs on 4 CPUs vs Colima's 2, but the
      # verdict is a growth exponent rather than an absolute time, so it ports.
      - name: Verify reference solutions
        run: uv run python scripts/verify_reference_solutions.py --strict-stub-check --complexity

      # The corpus gate is separate so a content-only failure is obvious in the
      # job list without reading logs.
      - name: Validate corpus
        run: uv run python -m corpus.validate

      # Anchors rot invisibly — renaming a heading breaks every link to it and nothing
      # complains. An audit found four such breaks that an existence-only check missed.
      - name: Doc links
        run: uv run python scripts/check_doc_links.py

      # Links prove a cross-reference resolves; this proves the claims on both ends of
      # it still agree — a doc indexed as a spec after its schema landed, or a phase the
      # README calls done and the buildlog calls half built. See CLAUDE.md.
      - name: Doc consistency
        run: uv run python scripts/check_docs.py

      # Backstop for GitHub's own secret scanning (push protection only sees a
      # push after it lands). This repo is public: see docs/SECURITY.md.
      - name: Secret scan
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            range="origin/$GITHUB_BASE_REF..HEAD"          # pull request
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && ! echo "$GITHUB_EVENT_BEFORE" | grep -qE '^0+$'; then
            range="$GITHUB_EVENT_BEFORE..HEAD"             # push to a branch that existed
          else
            range=""                                       # new branch or first push
          fi
          if [ -n "$range" ]; then bash scripts/secret_scan.sh "$range"; else bash scripts/secret_scan.sh; fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # CLAUDE.md's rule 1 — docs travel with the code — was enforced only by the pre-push
      # hook, which exists only after `make setup` runs `git config core.hooksPath hooks`.
      # A fresh clone, or a commit made anywhere else, had nothing checking it. The secret
      # scan was double-covered and the rule this repo says its value depends on was not.
      - name: Docs travel with the code
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            bash scripts/docs_with_code.sh "origin/$GITHUB_BASE_REF..HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && ! echo "$GITHUB_EVENT_BEFORE" | grep -qE '^0+$'; then
            bash scripts/docs_with_code.sh "$GITHUB_EVENT_BEFORE..HEAD"
          else
            echo "docs_with_code: skipped (new branch — no base to diff against)"
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  web:
    name: Web (lint · types · components · build)
    runs-on: ubuntu-latest

    # Its own job rather than a step in `python`: it shares no toolchain with
    # that one, and running in parallel keeps a frontend typo from waiting on
    # Postgres, Docker and the sandbox suite to find out.
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Component tests run against recorded SSE fixtures, so no API, no
      # database and no model provider are involved (docs/WEB.md).
      - name: Component tests
        run: pnpm test

      # A build is the only thing that catches a server/client boundary mistake
      # — a hook in a server component typechecks and then fails at render.
      - name: Build
        run: pnpm build

      # Fails on `high` only, and reports the rest. A gate that breaks the build
      # the moment anyone publishes a moderate advisory against a transitive
      # dependency is a gate people learn to skip — the same reasoning that
      # keeps `make hygiene` non-failing. High is rare and actionable.
      #
      # The frontend brought 25 advisories with it on the day it landed, so this
      # is not hypothetical: 8 were in `next` itself, including SSRF in rewrites,
      # which is the mechanism this app's API proxy is built on.
      - name: Audit dependencies
        run: |
          pnpm audit || true
          pnpm audit --audit-level high

  browser:
    name: Browser (the Phase 5 gate, against the containerised stack)
    runs-on: ubuntu-latest

    # `make test-browser` was local-only from 2026-09-22 to 2026-09-29, "because CI has no
    # stack to point it at". A runner has Docker, so the stack is the same compose file
    # `make up-stack` runs — Caddy front door, same-origin /api, the real session cookie —
    # built from this commit. Nothing is stubbed that the local gate does not stub.
    #
    # No real secret is involved. The session secret is generated here and dies with the
    # runner, and no model provider is configured: every spec is a page load, a nav click
    # or a pager button, and none of those reach a model. The database is a fresh one,
    # migrated, seeded and given one session; the two specs that need a logged practice
    # problem skip with a reason rather than pass on data this job does not have — see
    # docs/WEB.md.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The host side needs Python for three things: migrations, the seed, and
      # `api.mint_session`, which auth.setup.ts shells out to for the cookie.
      - name: Sync workspace
        run: uv sync --all-packages

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      # The compose file reads `.env` for the API container and the host-side mint reads
      # it too, so both sign and verify with the same throwaway secret. COOKIE_SECURE is
      # false because the stack is plain http on localhost, exactly as locally.
      - name: Write a throwaway .env
        run: |
          secret=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$secret"
          {
            echo "DATABASE_URL=postgresql+psycopg://interview:interview@localhost:5432/interview_helper"
            echo "SESSION_SECRET=$secret"
            echo "COOKIE_SECURE=false"
          } > .env

      # Postgres first and alone, so the schema and the corpus exist before the API
      # serves its first request. The API image does not migrate on start.
      - name: Start Postgres
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait postgres

      - name: Migrate and seed
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run python -m api.seed

      # The same command `make up-stack` runs, with `--wait` so the step ends when every
      # healthcheck passes rather than when the containers merely exist.
      - name: Build and start the stack
        run: docker compose -f infra/compose/docker-compose.yml --profile stack up -d --build --wait

      # Three specs skip on a database with no session: /history's order, the live event
      # stream through the front door, and the report's 409 problem document. The stream
      # is the one the front door is most able to break, so the job makes one — through
      # the API, the way the app does. The planner is deterministic, so this reaches no
      # model. A logged practice problem cannot be made the same way (its classification
      # is a model call), so the two specs that need one still skip here.
      - name: Create a session for the specs to open
        run: |
          token=$(uv run python -m api.mint_session --raw)
          echo "::add-mask::$token"
          curl -sSf -X POST http://localhost:3000/api/v1/sessions \
            -H "Cookie: ih_session=$token" -H "Content-Type: application/json" \
            -d '{"mode": "coding"}' -o /dev/null -w "POST /api/v1/sessions -> %{http_code}\n"

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser gate
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Stack logs
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile stack logs --no-color > stack-logs.txt 2>&1 || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/.playwright/
            stack-logs.txt
          retention-days: 14
          include-hidden-files: true
