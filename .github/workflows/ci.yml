name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint · types · tests · corpus)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_helper"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://interview:interview@localhost:5432/interview_helper

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy apps/api/src apps/executor/src packages/corpus/src

      - name: Test
        run: uv run pytest -q

      # The schema is only meaningfully tested against real Postgres — the CHECK
      # constraint on concept_evidence has no SQLite equivalent.
      - name: Migrate and seed
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run python -m api.seed

      - name: DB tests
        run: uv run pytest apps/api/tests -q -m db

      # The escape tests are the Phase 2 gate and need a real daemon — they cannot be
      # meaningfully faked, since what they verify is kernel-enforced isolation.
      - name: Pull sandbox image
        run: docker pull python:3.12-slim

      # Every sandbox-marked test, not just apps/executor's: the coding grader is
      # verified end to end through the same containers, from apps/api.
      - name: Sandbox tests
        run: uv run pytest -q -m sandbox

      # docs/GRADING.md: reference solutions are verified, not trusted. Runs them
      # through the same sandbox a candidate's submission gets.
      # --complexity additionally asserts each reference solution actually meets the
      # complexity_target its own item declares. CI runs on 4 CPUs vs Colima's 2, but the
      # verdict is a growth exponent rather than an absolute time, so it ports.
      - name: Verify reference solutions
        run: uv run python scripts/verify_reference_solutions.py --strict-stub-check --complexity

      # The corpus gate is separate so a content-only failure is obvious in the
      # job list without reading logs.
      - name: Validate corpus
        run: uv run python -m corpus.validate

      # Anchors rot invisibly — renaming a heading breaks every link to it and nothing
      # complains. An audit found four such breaks that an existence-only check missed.
      - name: Doc links
        run: uv run python scripts/check_doc_links.py

      # Backstop for GitHub's own secret scanning (push protection only sees a
      # push after it lands). This repo is public: see docs/SECURITY.md.
      - name: Secret scan
        run: bash scripts/secret_scan.sh
