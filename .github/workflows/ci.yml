name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint · types · tests · corpus)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_helper"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://interview:interview@localhost:5432/interview_helper

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the secret scan reads the commits being introduced, not just the
          # tree. A shallow clone has nothing to read, and would report clean.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy apps/api/src apps/executor/src packages/corpus/src

      - name: Test
        run: uv run pytest -q

      # The schema is only meaningfully tested against real Postgres — the CHECK
      # constraint on concept_evidence has no SQLite equivalent.
      # Up, all the way back down, and up again. Only the first direction is ever
      # exercised by developing against a long-lived local database, and OPERATIONS.md
      # treats a migration that cannot be reversed as a deploy that cannot be rolled back.
      - name: Migrate, reverse, migrate
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Seed
        run: uv run python -m api.seed

      - name: DB tests
        run: uv run pytest apps/api/tests -q -m db

      # Reported, not enforced. A coverage threshold in CI turns into a number people
      # satisfy rather than a signal they read, and the marker set matters more than the
      # figure: the same code measures ~26 points lower without a database, because the
      # session layer, the planner and the practice log are covered by db-marked tests.
      - name: Coverage (reported)
        run: |
          uv run pytest -q -m "not sandbox and not e2e and not llm" \
            --cov=api --cov=executor --cov=corpus --cov-report=term | tail -20

      # The escape tests are the Phase 2 gate and need a real daemon — they cannot be
      # meaningfully faked, since what they verify is kernel-enforced isolation.
      - name: Pull sandbox image
        run: docker pull python:3.12-slim

      # Every sandbox-marked test, not just apps/executor's: the coding grader is
      # verified end to end through the same containers, from apps/api.
      - name: Sandbox tests
        run: uv run pytest -q -m sandbox

      # The only test with nothing stubbed: a real executor process on a socket, real
      # containers, real rows. Needs the Postgres service and Docker, so it runs here,
      # after both are known good.
      - name: End-to-end session
        run: uv run pytest -q -m e2e

      # docs/GRADING.md: reference solutions are verified, not trusted. Runs them
      # through the same sandbox a candidate's submission gets.
      # --complexity additionally asserts each reference solution actually meets the
      # complexity_target its own item declares. CI runs on 4 CPUs vs Colima's 2, but the
      # verdict is a growth exponent rather than an absolute time, so it ports.
      - name: Verify reference solutions
        run: uv run python scripts/verify_reference_solutions.py --strict-stub-check --complexity

      # The corpus gate is separate so a content-only failure is obvious in the
      # job list without reading logs.
      - name: Validate corpus
        run: uv run python -m corpus.validate

      # Anchors rot invisibly — renaming a heading breaks every link to it and nothing
      # complains. An audit found four such breaks that an existence-only check missed.
      - name: Doc links
        run: uv run python scripts/check_doc_links.py

      # Links prove a cross-reference resolves; this proves the claims on both ends of
      # it still agree — a doc indexed as a spec after its schema landed, or a phase the
      # README calls done and the buildlog calls half built. See CLAUDE.md.
      - name: Doc consistency
        run: uv run python scripts/check_docs.py

      # Backstop for GitHub's own secret scanning (push protection only sees a
      # push after it lands). This repo is public: see docs/SECURITY.md.
      - name: Secret scan
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            range="origin/$GITHUB_BASE_REF..HEAD"          # pull request
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && ! echo "$GITHUB_EVENT_BEFORE" | grep -qE '^0+$'; then
            range="$GITHUB_EVENT_BEFORE..HEAD"             # push to a branch that existed
          else
            range=""                                       # new branch or first push
          fi
          if [ -n "$range" ]; then bash scripts/secret_scan.sh "$range"; else bash scripts/secret_scan.sh; fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # CLAUDE.md's rule 1 — docs travel with the code — was enforced only by the pre-push
      # hook, which exists only after `make setup` runs `git config core.hooksPath hooks`.
      # A fresh clone, or a commit made anywhere else, had nothing checking it. The secret
      # scan was double-covered and the rule this repo says its value depends on was not.
      - name: Docs travel with the code
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            bash scripts/docs_with_code.sh "origin/$GITHUB_BASE_REF..HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && ! echo "$GITHUB_EVENT_BEFORE" | grep -qE '^0+$'; then
            bash scripts/docs_with_code.sh "$GITHUB_EVENT_BEFORE..HEAD"
          else
            echo "docs_with_code: skipped (new branch — no base to diff against)"
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  web:
    name: Web (lint · types · components · build)
    runs-on: ubuntu-latest

    # Its own job rather than a step in `python`: it shares no toolchain with
    # that one, and running in parallel keeps a frontend typo from waiting on
    # Postgres, Docker and the sandbox suite to find out.
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Component tests run against recorded SSE fixtures, so no API, no
      # database and no model provider are involved (docs/WEB.md).
      - name: Component tests
        run: pnpm test

      # A build is the only thing that catches a server/client boundary mistake
      # — a hook in a server component typechecks and then fails at render.
      - name: Build
        run: pnpm build

      # Fails on `high` only, and reports the rest. A gate that breaks the build
      # the moment anyone publishes a moderate advisory against a transitive
      # dependency is a gate people learn to skip — the same reasoning that
      # keeps `make hygiene` non-failing. High is rare and actionable.
      #
      # The frontend brought 25 advisories with it on the day it landed, so this
      # is not hypothetical: 8 were in `next` itself, including SSRF in rewrites,
      # which is the mechanism this app's API proxy is built on.
      - name: Audit dependencies
        run: |
          pnpm audit || true
          pnpm audit --audit-level high
