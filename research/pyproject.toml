[project]
name = "research"
version = "0.1.0"
description = "Build-time corpus research pipeline: provenance records, evidence-density ranking, spot-check sampling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "corpus",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.uv.sources]
corpus = { workspace = true }
