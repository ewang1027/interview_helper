[project]
name = "api"
version = "0.1.0"
description = "interview_helper API: sessions, interviewer agent, grading, mastery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "sse-starlette>=2.2",
    "httpx>=0.28",
    "python-ulid>=3.0",
    # Claude via Bedrock (credit-funded) with Anthropic-direct as the escape hatch
    "anthropic[bedrock]>=0.69",
    "corpus",
    "fsrs>=6.3",
    # The quant answer check: symbolic equivalence, so 1/3, 0.333... and 2/6 all pass.
    # Never asked to parse anything but a bounded, character-allowlisted expression —
    # sympy's parser evaluates, and the candidate's answer is untrusted text.
    "sympy>=1.13",
]

[tool.uv.sources]
corpus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
