[alembic]
# %(here)s = the directory holding this file, so `alembic -c apps/api/alembic.ini`
# works from the repo root (how make dev and CI invoke it), not just from apps/api.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os

# sqlalchemy.url is intentionally absent — migrations/env.py reads it from
# api.settings.get_settings() so DATABASE_URL stays the single source of truth.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
